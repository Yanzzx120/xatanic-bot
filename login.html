<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Xatanic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0a0a15; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px 30px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; backdrop-filter: blur(20px); }
        .logo { font-size: 40px; color: #00d9ff; margin-bottom: 10px; }
        h2 { margin-bottom: 20px; font-weight: 600; }
        input { width: 100%; padding: 12px 15px; margin-bottom: 15px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; outline: none; font-size: 14px; }
        input:focus { border-color: #00d9ff; }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #00d9ff, #b829ff); border: none; border-radius: 10px; color: #fff; font-weight: bold; font-size: 14px; cursor: pointer; transition: transform 0.2s; }
        button:active { transform: scale(0.95); }
        .error { color: #ff3860; font-size: 12px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <i class="fa-solid fa-bolt logo"></i>
        <h2>Xatanic Login</h2>
        <div class="error" id="errorMsg">Username atau Password salah!</div>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Masuk Dashboard</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const errMsg = document.getElementById('errorMsg');
            btn.innerText = 'Memproses...'; btn.disabled = true; errMsg.style.display = 'none';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
                });
                const data = await res.json();
                if (data.success) window.location.href = '/';
                else errMsg.style.display = 'block';
            } catch (err) { alert('Gagal terhubung ke server.'); }
            finally { btn.innerText = 'Masuk Dashboard'; btn.disabled = false; }
        });
    </script>
</body>
</html>
