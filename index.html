<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xatanic Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="bg-blur"></div>
    <header class="top-bar">
        <div class="brand">
            <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
            <div><h1 id="botName">Xatanic</h1><span id="botVersion">v2.0.0</span></div>
        </div>
        <a href="/api/logout" class="logout-btn" title="Logout"><i class="fa-solid fa-power-off"></i></a>
        <div class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">Connecting...</span></div>
    </header>

    <div class="profile-card">
        <div class="avatar-wrap">
            <img src="https://i.pinimg.com/736x/8e/09/3c/8e093c9b9d0d9f8e6c0b7d5c5c6f7d8e.jpg" alt="avatar">
            <span class="verified-badge"><i class="fa-solid fa-check"></i></span>
        </div>
        <div class="profile-info">
            <h2>yanzii <i class="fa-solid fa-circle-check verified"></i></h2>
            <span class="role-badge">OWNER</span>
            <p class="last-update">Update: <span id="lastUpdate">-</span></p>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon battery"><i class="fa-solid fa-battery-three-quarters"></i></div>
            <div class="stat-info"><span class="stat-label">Baterai</span><span class="stat-value" id="val-battery">0%</span></div>
            <div class="progress-bar"><div class="progress" id="bar-battery"></div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon ram"><i class="fa-solid fa-microchip"></i></div>
            <div class="stat-info"><span class="stat-label">RAM</span><span class="stat-value" id="val-ram">0%</span></div>
            <div class="progress-bar"><div class="progress" id="bar-ram"></div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon storage"><i class="fa-solid fa-server"></i></div>
            <div class="stat-info"><span class="stat-label">Storage</span><span class="stat-value" id="val-storage">0%</span></div>
            <div class="progress-bar"><div class="progress" id="bar-storage"></div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon uptime"><i class="fa-solid fa-clock"></i></div>
            <div class="stat-info"><span class="stat-label">Uptime</span><span class="stat-value small" id="val-uptime">-</span></div>
        </div>
    </div>

    <div class="chart-card">
        <div class="chart-header"><h3><i class="fa-solid fa-chart-line"></i> RAM Realtime</h3><span class="live-badge"><i class="fa-solid fa-circle"></i> LIVE</span></div>
        <canvas id="ramChart"></canvas>
    </div>

    <div class="info-card">
        <div class="info-row"><span><i class="fa-solid fa-mobile-screen"></i> Device</span><strong id="val-device">-</strong></div>
        <div class="info-row"><span><i class="fa-solid fa-wifi"></i> Network</span><strong class="green" id="val-network">-</strong></div>
        <div class="info-row"><span><i class="fa-solid fa-key"></i> Session</span><strong class="highlight" id="val-session">-</strong></div>
        <div class="info-row"><span><i class="fa-solid fa-clock"></i> Waktu</span><strong id="val-time">-</strong></div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active"><div class="nav-icon-bg"><i class="fa-solid fa-house"></i></div><span>Home</span></div>
        <div class="nav-item"><i class="fa-solid fa-chart-simple"></i><span>Stats</span></div>
        <div class="nav-item"><i class="fa-solid fa-gear"></i><span>Config</span></div>
        <div class="nav-item"><i class="fa-solid fa-circle-info"></i><span>Info</span></div>
    </nav>
    <script src="app.js"></script>
</body>
</html>
